<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Portal do Dev</title>
</head>

<body>
    <main id="wrapper">
        <div>
            <h1>Seja bem-vindo, dev!</h1>
            <p>Faça login para acessar o sistema</p>
            <form>
                <div class="input-box">
                    <label for="email-input">Email</label>
                    <input type="email" name="email-input" id="email-input">
                </div>

                <div class="input-box">
                    <label for="password-input">Senha</label>
                    <input type="password" name="password-input" id="password-input">
                </div>
                <button>Entrar</button>
            </form>
        </div>

    </main>
    <div class="cad-link">
        <p>Ainda não tem uma conta? <a href="/cadastro">Cadastre-se já</a></p>
    </div>
    <script src="script.js"></script>
</body>

</html>
